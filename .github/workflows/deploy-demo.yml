# Publishes the standalone demo (synthetic data only) to GitHub Pages, so it
# can be shared at a clean URL instead of a file. The full server-backed app
# is not deployed here — this is just the shareable single-file demo.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/patient-flow-dashboard-9ign2f]
    paths:
      - 'standalone/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp standalone/meridian-demo.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
