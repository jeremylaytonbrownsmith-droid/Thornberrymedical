# Keeps the GitHub Pages demo current. Pages serves this repo's default
# branch root, where index.html is a copy of the standalone demo (synthetic
# data only). This workflow re-syncs index.html whenever the demo changes.
# Pushes made with GITHUB_TOKEN do not retrigger workflows, so this cannot
# loop.
name: Sync demo to GitHub Pages

on:
  push:
    branches: [claude/patient-flow-dashboard-9ign2f]
    paths:
      - 'standalone/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync root index.html from standalone demo
        run: |
          cp standalone/meridian-demo.html index.html
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Pages index.html from standalone demo"
          git push
