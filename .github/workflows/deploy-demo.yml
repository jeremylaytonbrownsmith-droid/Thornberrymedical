# Publishes the standalone demo (synthetic data only) to GitHub Pages by
# updating the gh-pages branch whenever the demo file changes. The full
# server-backed app is not deployed here — this is just the shareable
# single-file demo.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/patient-flow-dashboard-9ign2f]
    paths:
      - 'standalone/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish demo to gh-pages
        run: |
          mkdir -p /tmp/site
          cp standalone/meridian-demo.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy demo from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
